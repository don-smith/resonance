<div class="ds-form-field ds-form-field--experimental">
  <label for="form-field-analyst">Analyst name</label>
  <input
    id="form-field-analyst"
    name="analyst"
    type="text"
    autocomplete="name"
    aria-describedby="form-field-help form-field-error"
  />
  <p class="ds-form-field__help" id="form-field-help">Use the name shown in the team directory.</p>
  <p class="ds-form-field__error" id="form-field-error" role="alert">
    Enter an analyst name before claiming the request.
  </p>
</div>
