name: Release template

# This workflow is intentionally a fork template. It has no configured secrets,
# release host, or Pages site in the reference repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate-release-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Materialize fork-owned public configuration
        env:
          RELEASE_CONFIGURATION: ${{ secrets.RESONANCE_RELEASE_CONFIGURATION }}
        run: |
          test -n "$RELEASE_CONFIGURATION" || { echo "Missing RESONANCE_RELEASE_CONFIGURATION secret"; exit 1; }
          printf '%s' "$RELEASE_CONFIGURATION" > config/release.json
      - name: Fail closed without valid config and signing material
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm release:validate -- --config config/release.json --require-signing-secret
      - uses: actions/upload-artifact@v4
        with:
          name: release-configuration
          path: config/release.json
          retention-days: 1

  build-signed-artifacts:
    needs: validate-release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            updater_target: darwin-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            updater_target: darwin-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            updater_target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: release-configuration, path: config }
      - name: Build and sign the target
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Development keeps updater artifacts off. This CI-only merge enables
          # signatures after the guards above have accepted real credentials.
          cp config/release.json apps/desktop/src-tauri/release-configuration.json
          printf '%s' '{"bundle":{"createUpdaterArtifacts":true,"resources":["release-configuration.json"]}}' > apps/desktop/src-tauri/tauri.release.conf.json
          pnpm --filter @resonance/desktop tauri build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }}
          pnpm release:collect -- --config config/release.json --target ${{ matrix.updater_target }} \
            --source target/${{ matrix.target }}/release/bundle --output release-artifacts
      - name: Upload signed updater artifact pair
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: release-artifacts/*

  publish-static-manifest:
    needs: build-signed-artifacts
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: release-configuration, path: config }
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: updater-*
          merge-multiple: true
      - name: Publish signed artifacts and latest.json to the static host
        shell: bash
        run: |
          mkdir -p pages
          cp release-artifacts/* pages/
          pnpm release:manifest -- --config config/release.json --artifacts release-artifacts \
            --version "${GITHUB_REF_NAME#v}" --output pages/latest.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - id: deployment
        uses: actions/deploy-pages@v4
