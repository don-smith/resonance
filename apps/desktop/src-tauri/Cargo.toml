[package]
name = "resonance-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
debug-local-profiles = ["resonance-runtime/debug-local-profiles"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
fs2 = "0.4.3"
resonance-runtime = { path = "../../../crates/runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.6.0", features = [] }
tauri-plugin-updater = "2.9.0"
tokio = { version = "1.48.0", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3.14.0"

[lints]
workspace = true
