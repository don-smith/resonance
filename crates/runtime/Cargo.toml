[package]
name = "resonance-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.2"
bs58 = "0.5.1"
getrandom = "0.3.4"
iroh = "=1.0.3"
iroh-gossip = "=0.101.0"
keyring = "=4.1.6"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
n0-future = "0.3.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
serde_json = "1.0.145"
url = { version = "2.5.4", features = ["serde"] }

[dev-dependencies]
iroh = { version = "=1.0.3", features = ["test-utils"] }
iroh-relay = { version = "=1.0.3", features = ["test-utils"] }
tokio = { version = "1.53.1", features = ["macros"] }
tempfile = "3.14.0"

[lints]
workspace = true
