[package]
name = "resonance-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
debug-local-profiles = []

[dependencies]
blake3 = "1.8.2"
bs58 = "0.5.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
commonware-codec = { version = "=2026.7.1", default-features = false, features = ["std"] }
commonware-cryptography = { version = "=2026.7.1", default-features = false, features = ["std"] }
commonware-p2p = { version = "=2026.7.1", default-features = false }
commonware-runtime = { version = "=2026.7.1", default-features = false }
commonware-utils = { version = "=2026.7.1", default-features = false, features = ["std"] }
getrandom = "0.3.4"
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
iroh = "=1.0.3"
iroh-gossip = "=0.101.0"
keyring = "=4.1.6"
n0-future = "0.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1.24"
url = { version = "2.5.4", features = ["serde"] }
zeroize = "=1.9.0"

[dev-dependencies]
iroh = { version = "=1.0.3", features = ["test-utils"] }
iroh-relay = { version = "=1.0.3", features = ["test-utils"] }
tokio = { workspace = true, features = ["macros"] }
tempfile = "3.14.0"

[lints]
workspace = true
